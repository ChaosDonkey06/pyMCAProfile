[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymcaprofile"
version = "0.1.0"
description = "MCAP: Monte Carlo adjusted profile."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ChaosDonkey06" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "loess>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.6"]

[project.scripts]
mcap = "mcap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
